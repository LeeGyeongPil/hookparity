# Offline test suite: no agent binaries, no API keys, no network after install.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catch breakage from Node or dependency updates
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Smoke test the example (gemini row is expected to differ)
        run: node dist/cli.js run --dir examples/crossagent --tool shell --input '{"command":"curl https://example.com"}'
